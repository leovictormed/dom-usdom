[package]
name = "ssz_types"
version = "0.11.0"
edition = "2021"
license = "Apache-2.0"
description = "Path-pinned Ethereum SSZ container types for DOM proof verification"
publish = false

[features]
arbitrary = ["dep:arbitrary"]

[dependencies]
arbitrary = { version = "1.0", default-features = false, optional = true }
ethereum_serde_utils = "0.8.0"
ethereum_ssz = "0.9.0"
itertools = "0.13.0"
serde = "1.0.0"
serde_derive = "1.0.0"
smallvec = "1.8.0"
tree_hash = { path = "../dom-ethereum-tree-hash" }
typenum = "1.12.0"

[dev-dependencies]
serde_json = "1.0.0"
tree_hash_derive = "0.10.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Keep the published 0.11.0 sources byte-identical; these newer spellings do
# not change the SSZ relation and would obscure provenance.
manual_div_ceil = "allow"
manual_repeat_n = "allow"
needless_question_mark = "allow"
