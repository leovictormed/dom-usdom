[package]
name        = "dom-crypto"
description = "DOM protocol — cryptographic primitives (RFC-0001, RFC-0009)"
version.workspace    = true
edition.workspace    = true
rust-version.workspace = true
authors.workspace    = true
license.workspace    = true

[features]
default = ["native-backend"]
native-backend = [
    "dep:grin_secp256k1zkp",
    "dep:rand",
    "dep:secp256k1",
    "dep:secp256k1-zkp",
]
portable-verifier = ["dep:dom-bulletproof-portable"]
test-helpers = ["native-backend"]

[dependencies]
dom-core.workspace   = true
dom-bulletproof-portable = { workspace = true, optional = true }
secp256k1 = { workspace = true, optional = true }
secp256k1-zkp = { git = "https://github.com/BlockstreamResearch/rust-secp256k1-zkp", rev = "264e84adf7b06fb4d028eb2fd992f33c4d8999b7", features = ["global-context", "rand-std"], optional = true }
# Bulletproof migration: exact pin, no floating branch.
grin_secp256k1zkp = { workspace = true, optional = true }
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
hkdf = { version = "0.12", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
k256 = { version = "0.13", default-features = false, features = ["hash2curve", "arithmetic", "expose-field"] }
zeroize.workspace    = true
subtle.workspace     = true
hex.workspace        = true
thiserror.workspace  = true
rand = { workspace = true, optional = true }

[dev-dependencies]
dom-bulletproof-portable.workspace = true
hex.workspace = true
rand.workspace = true
# F4 algebraic-invariant property tests (tests/algebraic_proptest.rs).
proptest.workspace = true
# F6 negative KAV: authoritative curve order n (secp256k1::constants::CURVE_ORDER)
# for boundary rejection cases (>= n). The library constant, not a memorized value.
secp256k1.workspace = true
# AUDIT-002 is_square equivalence proof companion (test-only): exact big-int
# exponent arithmetic for the addition-chain / Euler checks, and the real k256
# field oracle. k256 is also a normal dependency; repeating it here with the
# same `expose-field` feature lets the integration test reach FieldElement.
primitive-types.workspace = true
k256.workspace = true

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(kani)'] }
