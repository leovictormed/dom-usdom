[package]
name = "dom-usdom-privacy"
description = "Canonical ZK-friendly primitives for native USDOM notes"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
ark-bn254 = { version = "=0.5.0", default-features = false, features = ["curve"] }
ark-crypto-primitives = { version = "=0.5.0", default-features = false, features = ["sponge", "r1cs"] }
ark-ff = { version = "=0.5.0", default-features = false }
ark-groth16 = { version = "=0.5.0", default-features = false }
ark-r1cs-std = { version = "=0.5.0", default-features = false }
ark-relations = { version = "=0.5.1", default-features = false }
ark-serialize = { version = "=0.5.0", default-features = false }
dom-core.workspace = true
sha2 = { version = "0.10", default-features = false }
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
hex.workspace = true
rand = "0.8.6"
