[package]
name        = "dom-chain"
description = "DOM chain state — IBD, reorganization, chain selection"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
# Isolated research only. No Ethereum authentication or mainnet activation.
ethereum-checkpoint-poc = ["dep:sha3"]
# Concrete proof composition remains opt-in and regtest-only until DOM headers
# commit the native USDOM state root carried by the checkpoint.
ethereum-checkpoint-verified-poc = [
    "ethereum-checkpoint-poc",
    "dep:usdom-ethereum-finality-experiment",
]
# Bounded proof envelope plus the in-memory bridge from authenticated native
# USDOM transitions to the reserved Regtest-only block-v4 validator. It does
# not activate v4 in ChainState.
native-usdom-v4-poc = [
    "ethereum-checkpoint-verified-poc",
    "dep:dom-usdom-state",
    "dep:dom-usdom-privacy",
    "dep:dom-usdom-finalized-burn-program",
    "dep:dom-usdom-rpc-protocol",
    "dom-usdom-state/ethereum-finality",
    "dep:usdom-ethereum-finality-experiment",
]

[dependencies]
blake2.workspace = true
dom-core.workspace          = true
dom-consensus.workspace     = true
dom-serialization.workspace = true
dom-store.workspace         = true
dom-pow.workspace           = true
dom-pmmr.workspace          = true
dom-crypto.workspace        = true
thiserror.workspace         = true
tracing.workspace           = true
primitive-types.workspace = true
hex.workspace               = true
sha3 = { version = "0.10", default-features = false, features = ["std"], optional = true }
usdom-ethereum-finality-experiment = { path = "../../labs/usdom-ethereum-finality", optional = true }
dom-usdom-state = { path = "../dom-usdom-state", optional = true }
dom-usdom-privacy = { path = "../dom-usdom-privacy", optional = true }
dom-usdom-finalized-burn-program = { path = "../dom-usdom-finalized-burn-program", optional = true }
dom-usdom-rpc-protocol = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3.10"
lmdb.workspace = true
proptest.workspace = true
tracing-subscriber.workspace = true
usdom-ethereum-finality-experiment = { path = "../../labs/usdom-ethereum-finality", features = ["unsafe-test-oracle"] }
dom-usdom-state = { path = "../dom-usdom-state", features = ["unsafe-test-oracle"] }
dom-usdom-privacy = { path = "../dom-usdom-privacy" }
ark-bn254 = "=0.5.0"
ark-groth16 = "=0.5.0"
ark-serialize = "=0.5.0"
rand = "0.8.6"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
