[package]
name = "dom-usdom-checkpoint-outer-risc0-guest"
description = "RISC Zero outer guest for a complete DOM checkpoint statement"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[package.metadata.risc0]

[[bin]]
name = "usdom-checkpoint-outer"
path = "src/main.rs"
test = false
bench = false

[dependencies]
dom-usdom-checkpoint-program = { path = "../dom-usdom-checkpoint-program", features = ["outer-execution", "risc0-recursion"] }
risc0-zkvm = { version = "=3.0.6", default-features = false, features = ["std"] }

[lints]
workspace = true
