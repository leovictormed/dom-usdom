[package]
name = "dom-usdom-prover"
description = "Offline Groth16 prover for native USDOM wallet spends"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
ark-bn254 = { version = "=0.5.0", default-features = false, features = ["curve"] }
ark-groth16 = { version = "=0.5.0", default-features = false }
ark-poly = { version = "=0.5.0", default-features = false }
ark-relations = { version = "=0.5.1", default-features = false }
ark-serialize = { version = "=0.5.0", default-features = false }
dom-core.workspace = true
dom-crypto.workspace = true
dom-usdom-privacy = { path = "../dom-usdom-privacy" }
rand = "0.8.6"
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
ark-std = { version = "=0.5.0", default-features = false }
