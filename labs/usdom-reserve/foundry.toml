[profile.default]
src = "contracts"
test = "test/solidity"
out = "out"
cache_path = "cache"
libs = ["vendor"]
auto_detect_remappings = false
fs_permissions = [
  { access = "read", path = "test/fixtures/safe-1.4.1-mainnet.json" },
  { access = "read", path = "test/fixtures/risc0-mainnet-v3-runtime.hex" },
]
remappings = ["@openzeppelin/contracts/=vendor/openzeppelin-contracts-5.6.1/"]
solc_version = "0.8.37"
evm_version = "cancun"
optimizer = true
# Custody contracts are constrained by EIP-170 with a 4 KiB release margin.
# One run asks solc to optimize for deployed size; release gas ceilings are
# independently measured from the resulting canonical artifact.
optimizer_runs = 1
via_ir = true
bytecode_hash = "none"
ast = true
extra_output = ["storageLayout"]
fuzz = { runs = 1024 }
invariant = { runs = 256, depth = 64, fail_on_revert = true }

[profile.deep]
fuzz = { runs = 16384 }
invariant = { runs = 1024, depth = 128, fail_on_revert = true }

[fmt]
line_length = 120

[profile.fork]
test = "test/fork"
out = "out-fork"
cache_path = "cache-fork"
